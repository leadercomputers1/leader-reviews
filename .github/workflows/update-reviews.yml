# Once a day: reads the Google reviews and commits docs/reviews.json (served by GitHub Pages).
# The daily commit also keeps the schedule alive (GitHub pauses schedules in inactive repositories).
name: Update Google reviews

on:
  schedule:
    - cron: "17 3 * * *"   # 05:17 / 06:17 Israel time
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read reviews from Google
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GBP_LOCATION: ${{ secrets.GBP_LOCATION }}
        run: python fetch_reviews.py
      - name: Save
        run: |
          git config user.name "reviews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reviews.json
          git commit -m "Reviews $(date -u +%F)" || echo "No changes"
          git push
